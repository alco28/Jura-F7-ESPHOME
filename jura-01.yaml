# ========================
# ESPHome Jura Coffee Machine Configuration
# Author: @alco28
# ========================


# ========================
# Core ESPHome Setup
# ========================
esphome:
  name: ${devicename}
  comment: ${device_description}
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(jura_coffee_1).set_sensors(
            id(num_single_espresso), id(num_double_espresso), id(num_coffee), id(num_double_coffee),
            id(num_ristretto), id(num_single_capuccino), id(num_double_ristretto), id(num_brewunit_movements),
            id(num_clean), id(num_descaling), id(num_coffee_Grounds)
          );
          id(jura_coffee_1).set_text_sensors(id(tray_status), id(tank_status));
          id(jura_coffee_1).set_debug_switch(id(jura_debug_mode));


# ========================
# Hardware Platform
# ========================
esp8266:
  board: d1_mini
  framework:
    version: recommended
  restore_from_flash: True


# ========================
# Global Substitutions
# ========================
substitutions:
  devicename: jura
  friendly_name: Coffee Machine
  device_description: Jura koffiemachine in de Keuken
  time_timezone: "Europe/Amsterdam"
  sampling_period: 10s
  dallas_sampling_period: 30s
  samples: '4'
  decimals: '2'
  uart_tx_pin: D1 
  uart_rx_pin: D2 
  uart_baud_rate: "9600"

# Uncomment to enable captive portal for WiFi fallback
#captive_portal:


# ========================
# Logging
# ========================

logger:
  level: INFO #VERBOSE  # Set to DEBUG for more logs

# Enable debug component for RAM usage sensors
#debug:
 # update_interval: 60s




wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${devicename} Fallback Hotspot"
    password: "fallback_password"
 # domain: .lan

# ⬇ Enable Home Assistant API ⬇ 
ota:
 platform: esphome 
 password: !secret ota_password

safe_mode:
  num_attempts: 3


# Uncomment to use API password
#password: !secret api_password
api:
  encryption:
    key: !secret api_key_password



web_server:
  port: 80
uart:
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: ${uart_baud_rate}
  id: uart_bus


# ========================
# Dallas/1-Wire Temperature Sensor (optional, for room temp)
# ========================
one_wire:
  - platform: gpio
    pin: D5



################# CONTROL JURA FROM ESPHOME #################################################################
# UART command bytes below are for Jura Impressa F7 2016 (generated with generate_esphome_jura_yaml.py)
#############################################################################################################
# Command reference:
# an01 = ON switch
# fa01 = OFF
# fa03 = Maintenance menu
# fa04 = ENTER
# fa05 = Clockwise menu
# fa06 = Counterclockwise menu
# fa07 = Ristretto
# fa08 = Espresso
# fa09 = Make single coffee
# fa0A = Cappuccino
# fa0B = Steam
# fa0C = Hot water

switch:
  - platform: template
    name: 'Coffee Machine'
    icon: "mdi:coffee-maker"
    id: jura_on_off_switch
    optimistic: true
    assumed_state: true
    restore_mode: DISABLED  # Do not restore state on reboot
    # web_server:
      # sorting_group_id: sorting_group_jura_settings    
    turn_on_action:
      - uart.write: [0xDF, 0xDB, 0xDB, 0xDF]  ## 'A' - Power toggle
      - delay: 8ms
      - uart.write: [0xFB, 0xFF, 0xDB, 0xDF]  ## 'N' - On command
      - delay: 8ms
      - uart.write: [0xDF, 0xFF, 0xDB, 0xDB]  ## '\r'
      - delay: 8ms
      - uart.write: [0xFB, 0xFB, 0xDB, 0xDB]  ## '\n'
    turn_off_action:
      - uart.write: [0xFB, 0xDF, 0xDB, 0xDF]  ## 'F' - Off command
      - delay: 8ms
      - uart.write: [0xDF, 0xFF, 0xDB, 0xDB]  ## '\r'
      - delay: 8ms
      - uart.write: [0xFB, 0xFB, 0xDB, 0xDB]  ## '\n'
  
  # Debug switch for enabling verbose logging and fast polling (internal, not shown in Home Assistant)
  - platform: template
    name: "${friendly_name} Debug Mode"
    id: jura_debug_mode
    icon: "mdi:bug"
    optimistic: true
    restore_mode: DISABLED  # Do not restore state on reboot
    turn_on_action:
      - logger.set_level:
          level: VERY_VERBOSE
          tag: "jura_coffee"
    turn_off_action:
      - logger.set_level:
          level: INFO
          tag: "jura_coffee"




