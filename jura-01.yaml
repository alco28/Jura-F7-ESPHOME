##############################  SENSORS  ############################

sensor:
  - platform: template
    name: "Single Espressos Made"
    id: num_single_espresso
    accuracy_decimals: 0
    state_class: total_increasing
    filters:
      - filter_out: nan
      - skip_initial: 1

  - platform: template
    name: "Double Espressos Made"
    id: num_double_espresso
    accuracy_decimals: 0
    state_class: total_increasing
    filters:
      - filter_out: nan
      - skip_initial: 1

  - platform: template
